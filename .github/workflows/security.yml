name: Security & QA Audit

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  security-tests:
    name: Run Application Security Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Full git history for secret scanning

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Start Local Server
        run: |
          node server.js &
          sleep 3

      - name: Run Automated Security Suite
        env:
          NODE_ENV: test
          CI: "true"
          SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL || 'http://127.0.0.1:54321' }}
          SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY || 'mock-anon-key' }}
        run: npm run test:security
